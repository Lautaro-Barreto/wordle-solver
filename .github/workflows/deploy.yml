# This workflow automatically updates the sources for the Wordle Solver project whenever changes are pushed to the main branch in the 'wordle-solver' directory.
# It checks out the repository, sets up Python, installs dependencies, runs a script to update the sources, and commits and pushes any changes back to the repository.
# TO DO : 
#   ADD runs-on: self-hosted

name: Update Wordle Solver sources
on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:
jobs:
    update-sources:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repository
          uses: actions/checkout@v3

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.x'
        
        - name: Install dependencies
          run: |    
            python -m pip install --upgrade pip
            pip install requests
        
        - name: Run script to update sources
          run: |
            python update_sources.py
        
        - name: Commit and push changes
          run: |
            git config --global user.name 'github-actions'
            git config --global user.email 'github-actions@users.noreply.github.com'
            git add wordle-solver/src/past-wordle-answers.txt
            git commit -m "Update past Wordle answers"
            git push origin master